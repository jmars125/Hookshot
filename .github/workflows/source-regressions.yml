name: Game-free source regressions

on:
  push:
    branches: [main]
    paths:
      - nx2/nup.py
      - nx2/make_game.py
      - nx2/unpack.py
      - nx2/test_nup_paths.py
      - tests/test_make_game_cache.py
      - gpu/vk/vk_present_rect.h
      - gpu/vk/tests/present_rect_test.cpp
      - gpu/vk/vk_replay.cpp
      - tests/test_import_hold.py
      - tests/import_hold_test.cpp
      - gpu/vk/import_hold.h
      - .github/workflows/source-regressions.yml
  pull_request:
    branches: [main]
    paths:
      - nx2/nup.py
      - nx2/make_game.py
      - nx2/unpack.py
      - nx2/test_nup_paths.py
      - tests/test_make_game_cache.py
      - gpu/vk/vk_present_rect.h
      - gpu/vk/tests/present_rect_test.cpp
      - gpu/vk/vk_replay.cpp
      - tests/test_import_hold.py
      - tests/import_hold_test.cpp
      - gpu/vk/import_hold.h
      - .github/workflows/source-regressions.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python source checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check extraction boundaries
        run: python -I -B nx2/test_nup_paths.py
      - name: Check source-cache coherency
        run: python -I -B tests/test_make_game_cache.py
      - name: Check Vulkan presentation rectangle
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          @echo off
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo Visual Studio locator not found.
            exit /b 1
          )
          set "VSROOT="
          for /f "usebackq delims=" %%i in (`call "%VSWHERE%" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT (
            echo Visual Studio 2022 C++ tools not found.
            exit /b 1
          )
          if not exist "%VSROOT%\Common7\Tools\VsDevCmd.bat" (
            echo Visual Studio developer command prompt not found.
            exit /b 1
          )
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          where cl
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fo"%TEMP%\present_rect_test.obj" /Fe:"%TEMP%\present_rect_test.exe" gpu\vk\tests\present_rect_test.cpp
          if errorlevel 1 exit /b 1
          "%TEMP%\present_rect_test.exe"
          if errorlevel 1 exit /b 1
      - name: C++ compiler for the import-hold check
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Check failed-import backoff
        if: runner.os == 'Linux'
        run: python -I -B tests/test_import_hold.py
