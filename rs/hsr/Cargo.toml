[package]
name = "hsr"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Hookshot's build tool in Rust: reads the game package and (later) lifts it to native objects"

[dependencies]
anyhow = "1"
rayon = "1"
ruzstd = "0.9"
sha2 = "0.10"
cranelift-codegen = "0.137"
cranelift-frontend = "0.137"
cranelift-module = "0.137"
cranelift-jit = "0.137"
cranelift-native = "0.137"
cranelift-object = "0.137"
windows-sys = { version = "0.59", features = ["Win32_System_Memory"] }
